<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>学生会线上交流平台</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/student-union-platform/manifest.json" />

    <!-- 预热 Supabase 建连（DNS+TCP+TLS），省去首个 API 请求的建连时间。
         值由 Vite 在构建时做 HTML 常量替换（%VITE_*%）；变量缺失时字面保留、浏览器忽略该行，无副作用 -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />

    <!-- 主题色（亮色 + 暗色） -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1a3a5c" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101414" />

    <!-- 首帧主题预设：先于 CSS 读 localStorage，避免暗色用户白闪 -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('theme-mode');
          var dark = m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>

    <!-- iOS Safari 全屏 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="学生会平台" />

    <!-- 移动端颜色 -->
    <meta name="msapplication-TileColor" content="#1a3a5c" />
  </head>
  <body>
    <div id="root"></div>

    <!-- 版本更新 Toast 容器（SW 注册前创建，确保 updatefound 时可用）。
         视觉样式在 src/styles/base.css；display:none 必须保持内联以防样式未加载时闪现 -->
    <div id="pwa-update-toast" style="display:none;">
      🆕 新版本已就绪，点击刷新
    </div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- ==================== PWA Service Worker 注册 ==================== -->
    <script>
      (function () {
        var BASE = location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
        var LAST_VERSION_KEY = 'pwa_last_version';

        // 仅在 HTTPS 或 localhost 下注册 SW
        if (!('serviceWorker' in navigator)) return;
        if (!(location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) return;

        var updateToast = document.getElementById('pwa-update-toast');
        var newWorker = null;
        var pendingActivate = false; // 用户已点击更新提示，等待新 SW 接管
        var hasReloaded = false;

        function showUpdateToast() {
          if (!updateToast) return;
          updateToast.style.display = 'block';
          updateToast.onclick = function () {
            updateToast.style.display = 'none';
            if (newWorker) {
              // 新 SW 激活接管后会触发 controllerchange，由它统一清缓存并刷新
              pendingActivate = true;
              newWorker.postMessage({ type: 'skipWaiting' });
            } else {
              window.location.reload();
            }
          };
        }

        // 监听 SW 更新
        function trackUpdate(registration) {
          if (!registration) return;
          // 已有 waiting 状态的 SW（首次访问时 SW 已在等待激活）
          if (registration.waiting) {
            newWorker = registration.waiting;
            checkVersion();  // 同步拉取 changelog，存 localStorage
            showUpdateToast();
          }
          // 监听新 SW 安装
          registration.addEventListener('updatefound', function () {
            var installing = registration.installing;
            if (!installing) return;
            installing.addEventListener('statechange', function () {
              if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                newWorker = installing;
                checkVersion();  // 同步拉取 changelog
                showUpdateToast();
              }
            });
          });
        }

        // 版本检查（检查 version.json）
        function checkVersion() {
          fetch(BASE + '/version.json?t=' + Date.now())
            .then(function (r) { return r.json(); })
            .then(function (data) {
              var lastVer = localStorage.getItem(LAST_VERSION_KEY);
              if (data.version && data.version !== lastVer) {
                // 有新版本 → 存储版本号和 changelog，React 启动后读取
                localStorage.setItem('pwa_new_version', JSON.stringify(data));
              }
            })
            .catch(function () { /* 静默降级 */ });
        }

        // 注册 SW
        navigator.serviceWorker.register(BASE + '/sw.js', { scope: BASE + '/' })
          .then(function (registration) {
            console.log('[PWA] SW 已注册，scope:', registration.scope);

            // 检查是否有更新 waiting
            trackUpdate(registration);

            // 定期检查更新（每 10 分钟）
            setInterval(function () {
              registration.update().catch(function () {});
            }, 10 * 60 * 1000);

            // 版本检查延后 3s：避开冷启动与关键资源抢带宽
            setTimeout(checkVersion, 3000);
          })
          .catch(function (err) {
            console.warn('[PWA] SW 注册失败（非关键错误）:', err);
          });

        // SW 接管页面时触发。注意：首次访问（clients.claim）也会触发，
        // 必须用 pendingActivate 区分"用户主动更新"，否则首访会多刷一次
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (pendingActivate && !hasReloaded && navigator.serviceWorker.controller) {
            hasReloaded = true;
            // 新 SW 先清空全部缓存，随后的 reload 从网络拿全新 HTML + 资源
            navigator.serviceWorker.controller.postMessage({ type: 'PURGE_ALL' });
            setTimeout(function () { window.location.reload(); }, 300);
          }
        });

        // 手动安装按钮兜底（beforeinstallprompt）
        var deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          deferredPrompt = e;
          // 存储到 window，React 可以读取
          window.__pwaInstallPrompt = deferredPrompt;
        });
        window.addEventListener('appinstalled', function () {
          deferredPrompt = null;
          window.__pwaInstallPrompt = null;
          console.log('[PWA] 应用已安装');
        });
      })();
    </script>
  </body>
</html>
